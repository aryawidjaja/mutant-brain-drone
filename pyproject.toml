[project]
name = "mutant-brain-drone"
version = "0.1.0"
description = "Simulation study of an insect-model steering controller for a search-and-return quadrotor"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mujoco>=3.15.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
